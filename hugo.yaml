  # ---- ABOUT ----
  about:
    enable: true
    title: "About Me"
    image: "/images/Margie-Rome.jpg"
    content: |-
      MARITIME, AIR, AND LAND LOGISTICS LEADER:
      
      Results-driven logistics professional with over 18 years of progressive experience managing high-value international shipments across ocean, 
      air, and ground transportation for Latin America and the Caribbean markets. Handled monthly cargo volumes valued at $32–80 million, coordinating 
      end-to-end operations including export documentation (LCL/FCL), AES filings, hazardous materials compliance (IMO), carrier scheduling, and customs 
      processes while consistently exceeding customer expectations and maintaining exceptional service levels. Excelled in fast-paced, high-stakes environments 
      as a TSA-approved specialist with strong expertise in UPS, DHL, FedEx, and major accounts (Xerox, HP, Ingram Micro, Kodak, Goya, Digicel).
      
      Proven leader who supervised teams of 6–9 members across multiple roles, driving daily operational excellence, rapid conflict resolution, 
      and staff training programs that ensured seamless continuity and knowledge transfer. Key achievements include averting a potential $500,000 
      foreign customs penalty through meticulous record scrutiny and documentation, consistently surpassing monthly cargo delivery targets for multinational 
      clients, and supporting the regional expansion of Digicel (a $202M+ company) by orchestrating timely device deliveries across 31+ markets. 
      Recognized for building customer trust, reducing risks, and delivering reliable, high-impact logistics performance in complex global supply chains.

    skills:
      enable: true
