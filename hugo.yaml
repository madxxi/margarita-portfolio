                       and ground transportation for Latin America and the Caribbean markets."
            content: |
             • Handling 32-80 Million USD of monthly cargo for countries in the Caribbean and Latin America.
             • Daily operations of ocean (BOL’s Masters), air, (AWB’s) and ground logistics Chain.
             • Coordination of communications with all parties involved for each shipment. 
             • Organize and schedule cargo pickups for export and asses value of the cargo to be shipped. 
             • Responsible for accurate and efficient input of supplier data into the US Customs Automated Export System (AES) and customer billing.
             • Coordinator of shipments while ensuring increased customer satisfaction and quick resolution of customer conflicts. 
             • Experience brought to the job:
               o 14+ Year of experience in Logistics Department that includes export documentation for LCL and FCL (Less, full container load)
               o Preparation of UPS, DHL, FedEx documentation 
               o Preparation of IMO’s for Hazardous Materials
               o TSA approved
               o Ability to work in fast paced environment
               o Excellent customer service and client relations skills

          - name: "Export / Import Supervisor"
            date: "September 2010 - August 2017"
            info:
              content: "Senior Logistics Specialist responsible for managing high-value international shipments across ocean, 
