             • Achieved accurate and efficient input of supplier data into the US Customs Automated Export System (AES) and customer billing.
             • Coordinator of shipments while ensuring increased customer satisfaction and quick resolution of customer conflicts. 
             • Accountable for the training of new personnel assigned to the shipping department.
             • 13 Year of experience in Logistics Department to include export documentation for LCL and FCL (Less, full container load)
             • Preparing UPS, DHL, FedEx documentation
             • Preparing IMO’s for Hazardous Materials
             • TSA approved

             Achievements:
             o	2010-2016: Supervised a team that was part of the Musson Jamaica Limited group and provided services to one of the largest Network 
             solutions providers in Central America and the Caribbean, Digicel; my team serviced 34 countries as part of this $202 MM multinational company.   
             I supervised a talented, passionate, and highly ethical team who was committed to excellence and to meet their customers and shareholder’s needs.
             o	2005-2010: Member of a team that helped with the expansion of the largest mobile phone network provider of Central America and the Caribbean, 
             Digicel, which by the end of 2017 served more than 31 markets, our team arranged the collection and delivered mobile devices to all their markets in the region.

